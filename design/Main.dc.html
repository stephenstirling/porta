<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Start menu — Pinned</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Onest', system-ui, sans-serif; color: {{t.text}}; background: {{t.wallpaper}}">

  <!-- START MENU -->
  <div style="position: absolute; left: 340px; bottom: 72px; width: 760px; height: 680px; display: flex; border-radius: 20px; overflow: visible; background: {{t.panel}}; border: 1px solid {{t.border}}; box-shadow: {{t.shadow}}; backdrop-filter: blur(40px) saturate(160%); -webkit-backdrop-filter: blur(40px) saturate(160%)">

    <!-- LEFT PANE -->
    <div style="width: 500px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px">

      <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; background: {{t.input}}; border: 1px solid {{searchBorder}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{t.sub}}; flex-shrink: 0"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input type="search" aria-label="Search apps, files and settings" placeholder="Search apps, files and settings" value="{{query}}" onChange="{{onQuery}}" style="flex-grow: 1; border: 0; outline: none; background: transparent; color: {{t.text}}; font: inherit; font-size: 14px; min-width: 0">
        <span style="font-size: 11px; color: {{t.sub}}; padding: 3px 7px; border-radius: 6px; border: 1px solid {{t.border}}">Ctrl K</span>
      </label>

      <sc-if value="{{showTabs}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <div style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: {{t.seg}}">
            <button type="button" onClick="{{showPinnedView}}" style="border: 0; height: 32px; padding: 0 16px; border-radius: 9px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; background: {{pinnedTabBg}}; color: {{pinnedTabColor}}">Pinned</button>
            <button type="button" onClick="{{showAllView}}" style="border: 0; height: 32px; padding: 0 16px; border-radius: 9px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; background: {{allTabBg}}; color: {{allTabColor}}">All apps</button>
          </div>
          <a href="Settings.dc.html" style="display: flex; align-items: center; gap: 6px; color: {{t.sub}}; font-size: 13px; text-decoration: none; padding: 8px 4px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M14 4v4M8 10v4M16 16v4"></path></svg>Customize</a>
        </div>
      </sc-if>

      <!-- PINNED VIEW -->
      <sc-if value="{{showPinned}}" hint-placeholder-val="{{ true }}">
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
          <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; cursor: pointer; min-height: 88px">
            <span style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #E0A23A, #A9661A); box-shadow: 0 6px 16px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.28)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></span>
            <span style="font-size: 12.5px">Files</span>
          </button>
          <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; cursor: pointer; min-height: 88px">
            <span style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #3F8CF0, #1C55B8); box-shadow: 0 6px 16px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.28)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg></span>
            <span style="font-size: 12.5px">Browser</span>
          </button>
          <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; cursor: pointer; min-height: 88px">
            <span style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #2BA6C9, #14708A); box-shadow: 0 6px 16px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.28)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg></span>
            <span style="font-size: 12.5px">Mail</span>
          </button>
          <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; cursor: pointer; min-height: 88px">
            <span style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #E5604F, #A8352A); box-shadow: 0 6px 16px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.28)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span>
            <span style="font-size: 12.5px">Calendar</span>
          </button>
          <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; cursor: pointer; min-height: 88px">
            <span style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #8E6CF0, #5133B8); box-shadow: 0 6px 16px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.28)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="m21 16-5-5-9 9"></path></svg></span>
            <span style="font-size: 12.5px">Photos</span>
          </button>
          <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; cursor: pointer; min-height: 88px">
            <span style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #E0508C, #9E2357); box-shadow: 0 6px 16px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.28)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="17" cy="16" r="3"></circle></svg></span>
            <span style="font-size: 12.5px">Music</span>
          </button>
          <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; cursor: pointer; min-height: 88px">
            <span style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #C99A1F, #8A640C); box-shadow: 0 6px 16px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.28)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h10l4 4v14H5z"></path><path d="M9 8h3M9 12h6M9 16h6"></path></svg></span>
            <span style="font-size: 12.5px">Notes</span>
          </button>
          <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; cursor: pointer; min-height: 88px">
            <span style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #454B5A, #1D2029); box-shadow: 0 6px 16px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.22)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="m7 9 3 3-3 3M13 15h4"></path></svg></span>
            <span style="font-size: 12.5px">Terminal</span>
          </button>
          <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; cursor: pointer; min-height: 88px">
            <span style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #4FAF7A, #26704A); box-shadow: 0 6px 16px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.28)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"></path></svg></span>
            <span style="font-size: 12.5px">Calculator</span>
          </button>
          <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; cursor: pointer; min-height: 88px">
            <span style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #6B7385, #3E4555); box-shadow: 0 6px 16px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.28)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg></span>
            <span style="font-size: 12.5px">Settings</span>
          </button>
          <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; cursor: pointer; min-height: 88px">
            <span style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #F07A3E, #B84716); box-shadow: 0 6px 16px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.28)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.5-.9 1.2-1.7-.4-1 .3-2.3 1.5-2.3H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"></path><circle cx="7.5" cy="11" r="1"></circle><circle cx="10" cy="7" r="1"></circle><circle cx="15" cy="7" r="1"></circle></svg></span>
            <span style="font-size: 12.5px">Paint</span>
          </button>
          <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 4px 10px; border: 0; border-radius: 12px; background: transparent; color: {{t.text}}; font: inherit; cursor: pointer; min-height: 88px">
            <span style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #2F9D9A, #186361); box-shadow: 0 6px 16px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.28)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>
            <span style="font-size: 12.5px">Camera</span>
          </button>
        </div>

        <div style="height: 1px; background: {{t.divider}}; margin: 2px 0"></div>

        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; align-items: center; justify-content: space-between">
            <span style="font-size: 13px; font-weight: 600">Recent</span>
            <button type="button" style="border: 0; background: transparent; color: {{t.sub}}; font: inherit; font-size: 12.5px; cursor: pointer; padding: 6px 4px">More</button>
          </div>
          <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 7px 8px; border: 0; border-radius: 10px; background: transparent; color: {{t.text}}; font: inherit; cursor: pointer; text-align: left; min-height: 44px">
            <span style="width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: {{t.chip}}; color: #6FA0FF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"></path><path d="M9 12h6M9 16h6"></path></svg></span>
            <span style="display: flex; flex-direction: column; flex-grow: 1; gap: 2px"><span style="font-size: 13px">Quarterly report.docx</span><span style="font-size: 11.5px; color: {{t.sub}}">Documents</span></span>
            <span style="font-size: 11.5px; color: {{t.sub}}">2h ago</span>
          </button>
          <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 7px 8px; border: 0; border-radius: 10px; background: transparent; color: {{t.text}}; font: inherit; cursor: pointer; text-align: left; min-height: 44px">
            <span style="width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: {{t.chip}}; color: #B49CFF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="m21 16-5-5-9 9"></path></svg></span>
            <span style="display: flex; flex-direction: column; flex-grow: 1; gap: 2px"><span style="font-size: 13px">Lisbon trip</span><span style="font-size: 11.5px; color: {{t.sub}}">Pictures</span></span>
            <span style="font-size: 11.5px; color: {{t.sub}}">Yesterday</span>
          </button>
          <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 7px 8px; border: 0; border-radius: 10px; background: transparent; color: {{t.text}}; font: inherit; cursor: pointer; text-align: left; min-height: 44px">
            <span style="width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: {{t.chip}}; color: #5FCB94"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M4 10h16M10 4v16"></path></svg></span>
            <span style="display: flex; flex-direction: column; flex-grow: 1; gap: 2px"><span style="font-size: 13px">budget-2026.xlsx</span><span style="font-size: 11.5px; color: {{t.sub}}">Documents</span></span>
            <span style="font-size: 11.5px; color: {{t.sub}}">Mon</span>
          </button>
        </div>
      </sc-if>

      <!-- ALL APPS VIEW -->
      <sc-if value="{{showAll}}" hint-placeholder-val="{{ false }}">
        <div style="height: 520px; overflow-y: auto; margin: 0 -8px; padding: 0 8px; display: flex; flex-direction: column; gap: 2px">
          <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
            <div style="font-size: 12px; font-weight: 600; color: {{accent}}; padding: 10px 8px 4px; letter-spacing: 0.04em">{{g.letter}}</div>
            <sc-for list="{{g.apps}}" as="a" hint-placeholder-count="2">
              <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 6px 8px; border: 0; border-radius: 10px; background: transparent; color: {{t.text}}; font: inherit; font-size: 13.5px; cursor: pointer; text-align: left; min-height: 44px">
                <span style="width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #fff; background: {{a.bg}}">{{a.initial}}</span>
                <span>{{a.name}}</span>
              </button>
            </sc-for>
          </sc-for>
        </div>
      </sc-if>

      <!-- SEARCH VIEW -->
      <sc-if value="{{showSearch}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; gap: 8px">
          <span style="font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: {{accent}}; color: #0E1120">All</span>
          <span style="font-size: 12.5px; padding: 6px 12px; border-radius: 999px; background: {{t.seg}}; color: {{t.sub}}">Apps</span>
          <span style="font-size: 12.5px; padding: 6px 12px; border-radius: 999px; background: {{t.seg}}; color: {{t.sub}}">Documents</span>
          <span style="font-size: 12.5px; padding: 6px 12px; border-radius: 999px; background: {{t.seg}}; color: {{t.sub}}">Settings</span>
        </div>
        <sc-if value="{{hasBest}}" hint-placeholder-val="{{ true }}">
          <div style="font-size: 12px; font-weight: 600; color: {{t.sub}}; letter-spacing: 0.04em">BEST MATCH</div>
          <div style="display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 16px; background: {{t.chip}}; border: 1px solid {{accentSoft}}">
            <span style="width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600; color: #fff; background: {{best.bg}}">{{best.initial}}</span>
            <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1">
              <span style="font-size: 17px; font-weight: 600">{{best.name}}</span>
              <span style="font-size: 12.5px; color: {{t.sub}}">App</span>
            </div>
            <button type="button" style="border: 0; height: 36px; padding: 0 18px; border-radius: 10px; background: {{accent}}; color: #0E1120; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Open</button>
            <button type="button" style="height: 36px; padding: 0 14px; border-radius: 10px; background: transparent; border: 1px solid {{t.border}}; color: {{t.text}}; font: inherit; font-size: 13px; cursor: pointer">Pin</button>
          </div>
          <div style="font-size: 12px; font-weight: 600; color: {{t.sub}}; letter-spacing: 0.04em; margin-top: 4px">MORE RESULTS</div>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <sc-for list="{{rest}}" as="a" hint-placeholder-count="2">
              <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 6px 8px; border: 0; border-radius: 10px; background: transparent; color: {{t.text}}; font: inherit; font-size: 13.5px; cursor: pointer; text-align: left; min-height: 44px">
                <span style="width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #fff; background: {{a.bg}}">{{a.initial}}</span>
                <span style="flex-grow: 1">{{a.name}}</span>
                <span style="font-size: 11.5px; color: {{t.sub}}">App</span>
              </button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 40px 8px; text-align: center; color: {{t.sub}}; font-size: 13.5px">No apps match “{{query}}”</div>
        </sc-if>
      </sc-if>
    </div>

    <!-- RIGHT RAIL -->
    <div style="width: 260px; box-sizing: border-box; padding: 28px 16px 16px; display: flex; flex-direction: column; gap: 4px; background: {{t.rail}}; border-left: 1px solid {{t.divider}}; border-radius: 0 20px 20px 0; position: relative">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding-bottom: 18px">
        <span style="width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600; color: #0E1120; background: {{accent}}; box-shadow: 0 0 0 3px {{t.panelSolid}}, 0 0 0 5px {{accentSoft}}">AM</span>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
          <span style="font-size: 16px; font-weight: 600">Alex Morgan</span>
          <span style="font-size: 12px; color: {{t.sub}}">Local account</span>
        </div>
      </div>

      <button type="button" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: {{t.text}}; font: inherit; font-size: 13.5px; cursor: pointer; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="m7 9 3 3-3 3M13 15h4"></path></svg>Run…</button>

      <div style="flex-grow: 1"></div>

        <span style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em">8:14 PM</span>

      <sc-if value="{{powerOpen}}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; right: 16px; bottom: 72px; width: 196px; padding: 6px; border-radius: 14px; background: {{t.pop}}; border: 1px solid {{t.border}}; box-shadow: 0 16px 40px rgba(0,0,0,0.35); display: flex; flex-direction: column; gap: 2px">
          <button type="button" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: {{t.text}}; font: inherit; font-size: 13.5px; cursor: pointer; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>Sleep</button>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; justify-content: center; background: {{t.taskbar}}; border-top: 1px solid {{t.divider}}; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px)">

      <span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><span style="width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(145deg, #454B5A, #1D2029)"></span></span>

    <div style="position: absolute; right: 20px; display: flex; flex-direction: column; align-items: flex-end; font-size: 12px; line-height: 1.35">

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"accent":{"editor":"color","default":"#8AA8FF","options":["#8AA8FF","#F2A65A","#6FD3B5","#E58CB8"]},"startView":{"editor":"enum","options":["pinned","all","search"],"default":"pinned"},"seedQuery":{"editor":null,"default":"ca"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const theme = this.props.theme === 'light' ? 'light' : 'dark';
    const accent = this.props.accent ?? '#8AA8FF';
    const start = this.props.startView ?? 'pinned';
    const view = s.view ?? (start === 'all' ? 'all' : 'pinned');
    const query = s.query ?? (start === 'search' ? (this.props.seedQuery ?? 'ca') : '');
    const powerOpen = !!s.powerOpen;

    const dark = {
      wallpaper: 'radial-gradient(1100px 700px at 12% 18%, #3B2A7A 0%, rgba(59,42,122,0) 62%), radial-gradient(900px 650px at 88% 22%, #A4502C 0%, rgba(164,80,44,0) 58%), radial-gradient(1100px 700px at 55% 105%, #1C4A86 0%, rgba(28,74,134,0) 62%), #0B0D1A',
      panel: 'rgba(18,20,28,0.74)', panelSolid: '#171922', rail: 'rgba(255,255,255,0.035)',
      border: 'rgba(255,255,255,0.10)', divider: 'rgba(255,255,255,0.08)',
      text: '#F3F4F8', sub: '#A7ADBC', input: 'rgba(255,255,255,0.07)', seg: 'rgba(255,255,255,0.06)',
      chip: 'rgba(255,255,255,0.06)', taskbar: 'rgba(14,16,24,0.72)', pop: 'rgba(30,33,44,0.97)',
      shadow: '0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.2)'
    };
    const light = {
      wallpaper: 'radial-gradient(1100px 700px at 12% 18%, #C9C0F2 0%, rgba(201,192,242,0) 62%), radial-gradient(900px 650px at 88% 22%, #F6C9A8 0%, rgba(246,201,168,0) 58%), radial-gradient(1100px 700px at 55% 105%, #A9C8F0 0%, rgba(169,200,240,0) 62%), #EEF0F6',
      panel: 'rgba(250,250,253,0.80)', panelSolid: '#F7F7FA', rail: 'rgba(15,20,40,0.03)',
      border: 'rgba(15,20,40,0.10)', divider: 'rgba(15,20,40,0.08)',
      text: '#15171D', sub: '#555B68', input: 'rgba(15,20,40,0.06)', seg: 'rgba(15,20,40,0.06)',
      chip: 'rgba(15,20,40,0.05)', taskbar: 'rgba(248,248,252,0.78)', pop: 'rgba(255,255,255,0.98)',
      shadow: '0 30px 80px rgba(40,40,90,0.25), 0 0 0 1px rgba(15,20,40,0.04)'
    };
    const t = theme === 'light' ? light : dark;

    const colors = {
      amber: 'linear-gradient(145deg, #E0A23A, #A9661A)', blue: 'linear-gradient(145deg, #3F8CF0, #1C55B8)',
      teal: 'linear-gradient(145deg, #2BA6C9, #14708A)', red: 'linear-gradient(145deg, #E5604F, #A8352A)',
      violet: 'linear-gradient(145deg, #8E6CF0, #5133B8)', pink: 'linear-gradient(145deg, #E0508C, #9E2357)',
      gold: 'linear-gradient(145deg, #C99A1F, #8A640C)', slate: 'linear-gradient(145deg, #454B5A, #1D2029)',
      green: 'linear-gradient(145deg, #4FAF7A, #26704A)', grey: 'linear-gradient(145deg, #6B7385, #3E4555)',
      orange: 'linear-gradient(145deg, #F07A3E, #B84716)', sea: 'linear-gradient(145deg, #2F9D9A, #186361)'
    };
    const apps = [
      ['Archive', 'slate'], ['Backup', 'teal'], ['Browser', 'blue'], ['Calculator', 'green'],
      ['Calendar', 'red'], ['Camera', 'sea'], ['Clock', 'grey'], ['Contacts', 'orange'],
      ['Files', 'amber'], ['Mail', 'teal'], ['Maps', 'green'], ['Music', 'pink'],
      ['Notes', 'gold'], ['Paint', 'orange'], ['Photos', 'violet'], ['Recorder', 'red'],
      ['Settings', 'grey'], ['Terminal', 'slate'], ['Video', 'violet'], ['Weather', 'blue']
    ].map(([name, c]) => ({ name, initial: name[0], bg: colors[c] }));

    const groups = [];
    apps.forEach((a) => {
      let g = groups[groups.length - 1];
      if (!g || g.letter !== a.initial) { g = { letter: a.initial, apps: [] }; groups.push(g); }
      g.apps.push(a);
    });

    const q = query.trim().toLowerCase();
    const matches = q ? apps.filter((a) => a.name.toLowerCase().includes(q)) : [];
    const active = { bg: accent, color: '#0E1120' };
    const idle = { bg: 'transparent', color: t.sub };
    const pTab = view === 'pinned' ? active : idle;
    const aTab = view === 'all' ? active : idle;

    return {
      t, accent, query, groups, powerOpen,
      accentSoft: accent + '66',
      searchBorder: q ? accent : 'transparent',
      showTabs: !q, showPinned: !q && view === 'pinned', showAll: !q && view === 'all',
      showSearch: !!q, hasBest: matches.length > 0, noResults: !!q && matches.length === 0,
      best: matches[0] || { name: '', initial: '', bg: 'transparent' }, rest: matches.slice(1, 6),
      pinnedTabBg: pTab.bg, pinnedTabColor: pTab.color, allTabBg: aTab.bg, allTabColor: aTab.color,
      powerBg: powerOpen ? t.chip : 'transparent',
      onQuery: (e) => this.setState({ query: e.target.value }),
      showPinnedView: () => this.setState({ view: 'pinned' }),
      showAllView: () => this.setState({ view: 'all' }),
      togglePower: () => this.setState({ powerOpen: !powerOpen })
    };
  }
}
</script>
