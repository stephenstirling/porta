<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Porta letter jump</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: 'Segoe UI Variable Text', 'Segoe UI', 'Onest', system-ui, sans-serif; color: #F3F4F8; background: radial-gradient(1100px 700px at 12% 18%, #3B2A7A 0%, rgba(59,42,122,0) 62%), radial-gradient(900px 650px at 88% 22%, #A4502C 0%, rgba(164,80,44,0) 58%), radial-gradient(1100px 700px at 55% 105%, #1C4A86 0%, rgba(28,74,134,0) 62%), #0B0D1A">

  <div style="position: absolute; left: 340px; bottom: 72px; width: 760px; height: 680px; display: flex; border-radius: 20px; background: rgba(18,20,28,0.78); border: 1px solid rgba(255,255,255,0.10); box-shadow: 0 30px 80px rgba(0,0,0,0.55); backdrop-filter: blur(40px) saturate(160%); -webkit-backdrop-filter: blur(40px) saturate(160%)">
    <div style="width: 500px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px; position: relative; min-height: 0">
      <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 12px; background: rgba(255,255,255,0.07)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A7ADBC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-4-4"></path></svg>
        <input type="search" aria-label="Search" placeholder="Search apps, files, settings and answers" style="flex-grow: 1; border: 0; outline: none; background: transparent; color: #F3F4F8; font: inherit; font-size: 14px; min-width: 0">
      </label>
      <div style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,0.06); align-self: flex-start">
        <a href="MenuExtras.dc.html" style="height: 32px; padding: 0 16px; border-radius: 9px; font-size: 13px; font-weight: 600; color: #A7ADBC; display: flex; align-items: center; text-decoration: none">Pinned</a>
        <button type="button" style="border: 0; height: 32px; padding: 0 16px; border-radius: 9px; font: inherit; font-size: 13px; font-weight: 600; background: {{accent}}; color: #0E1120; cursor: pointer">All apps</button>
      </div>

      <!-- list -->
      <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 2px; margin: 0 -8px; padding: 0 8px">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <button type="button" onClick="{{openGrid}}" aria-label="Jump to a letter (now {{g.letter}})" style="align-self: flex-start; min-width: 44px; height: 36px; margin-top: 6px; padding: 0 10px; border: 0; border-radius: 9px; background: rgba(138,168,255,0.12); color: {{accent}}; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">{{g.letter}}</button>
          <sc-for list="{{g.apps}}" as="a" hint-placeholder-count="2">
            <button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 8px; border: 0; border-radius: 10px; background: transparent; color: #F3F4F8; font: inherit; font-size: 13.5px; cursor: pointer; text-align: left">
              <span style="width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #FFFFFF; background: {{a.bg}}">{{a.initial}}</span>
              <span style="flex-grow: 1">{{a.name}}</span>
              <sc-if value="{{a.isNew}}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 999px; background: {{accent}}; color: #0E1120">NEW</span>
              </sc-if>
            </button>
          </sc-for>
        </sc-for>
      </div>

      <!-- letter grid overlay -->
      <sc-if value="{{gridOpen}}" hint-placeholder-val="{{ true }}">
        <div style="position: absolute; left: 12px; right: 12px; top: 124px; bottom: 12px; border-radius: 16px; background: rgba(22,24,34,0.97); border: 1px solid rgba(255,255,255,0.10); display: flex; flex-direction: column; gap: 14px; padding: 22px; box-sizing: border-box">
          <span style="font-size: 13px; color: #A7ADBC">Jump to a letter. Greyed letters have no apps.</span>
          <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
            <sc-for list="{{letters}}" as="l" hint-placeholder-count="27">
              <button type="button" onClick="{{l.pick}}" aria-disabled="{{l.disabled}}" aria-label="{{l.label}}" style="height: 52px; border: 0; border-radius: 12px; background: {{l.bg}}; color: {{l.color}}; font: inherit; font-size: 18px; font-weight: 600; cursor: {{l.cursor}}">{{l.ch}}</button>
            </sc-for>
          </div>
        </div>
      </sc-if>
    </div>

    <div style="width: 260px; box-sizing: border-box; padding: 28px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: rgba(255,255,255,0.035); border-left: 1px solid rgba(255,255,255,0.08); border-radius: 0 20px 20px 0">
      <span role="img" aria-label="Account picture" style="width: 64px; height: 64px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 38%, #D8B79C 0 17%, rgba(0,0,0,0) 18%), radial-gradient(ellipse at 50% 100%, #3E5A86 0 46%, rgba(0,0,0,0) 47%), linear-gradient(160deg, #8EA9C9, #4B6386); box-shadow: 0 0 0 3px rgba(18,20,28,0.9), 0 0 0 5px rgba(138,168,255,0.4)"></span>
      <span style="font-size: 16px; font-weight: 600">[YOUR NAME]</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center; justify-content: center; gap: 6px; background: rgba(14,16,24,0.72); border-top: 1px solid rgba(255,255,255,0.08)">
    <span style="width: 44px; height: 44px; border-radius: 10px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 256 256" aria-label="Porta"><path d="M40 128a88 88 0 0 1 176 0" stroke="#8AA8FF" stroke-width="34" fill="none" stroke-linecap="round"></path><path d="M216 128a88 88 0 0 1-176 0" stroke="#5F7FE8" stroke-width="34" fill="none" stroke-linecap="round"></path><path d="M98 112a30 30 0 1 0 60 0a30 30 0 1 0-60 0M112 120l-13 64h58l-13-64z" fill="#3A4D70"></path></svg>
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8AA8FF","options":["#8AA8FF","#9DB4FF","#6F8CF0"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#8AA8FF';
    const s = this.state || {};
    const gridOpen = s.gridOpen ?? true;
    const start = s.start ?? 'A';
    const G = ['linear-gradient(145deg, #3F8CF0, #1C55B8)', 'linear-gradient(145deg, #4FAF7A, #26704A)', 'linear-gradient(145deg, #E0A23A, #A9661A)',
      'linear-gradient(145deg, #8E6CF0, #5133B8)', 'linear-gradient(145deg, #E5604F, #A8352A)', 'linear-gradient(145deg, #454B5A, #1D2029)',
      'linear-gradient(145deg, #2BA6C9, #14708A)', 'linear-gradient(145deg, #F07A3E, #B84716)'];
    const names = ['7-Zip', 'Audacity', 'Blender', 'Calculator', 'Calendar', 'Camera', 'Capta', 'Discord', 'Excel', 'File Explorer',
      'Firefox', 'GIMP', 'Google Chrome', 'HandBrake', 'Mail', 'Microsoft Edge', 'Notepad', 'Notion', 'OBS Studio', 'Ocula', 'Outlook',
      'Paint', 'Photos', 'PowerPoint', 'Settings', 'Slack', 'Spotify', 'Steam', 'Terminal', 'VLC', 'Visual Studio Code', 'Word', 'Zoom'];
    const fresh = ['Capta', 'Ocula'];
    const apps = names.map((name, i) => ({ name, initial: name[0], bg: G[i % G.length], isNew: fresh.includes(name) }));
    const key = (n) => (/[a-z]/i.test(n[0]) ? n[0].toUpperCase() : '#');
    const order = '#ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const byLetter = {};
    apps.forEach((a) => { (byLetter[key(a.name)] = byLetter[key(a.name)] || []).push(a); });

    const startIdx = order.indexOf(start);
    const groups = order.slice(startIdx).filter((l) => byLetter[l]).slice(0, 4).map((l) => ({ letter: l, apps: byLetter[l] }));

    const letters = order.map((ch) => {
      const has = !!byLetter[ch];
      return {
        ch, label: has ? `Jump to ${ch}` : `${ch}, no apps`, disabled: has ? 'false' : 'true',
        bg: ch === start && has ? accent : has ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.02)',
        color: ch === start && has ? '#0E1120' : has ? '#F3F4F8' : '#5A6070',
        cursor: has ? 'pointer' : 'default',
        pick: () => { if (has) this.setState({ start: ch, gridOpen: false }); }
      };
    });

    return { accent, gridOpen, groups, letters, openGrid: () => this.setState({ gridOpen: true }) };
  }
}
</script>
</body>
</html>
